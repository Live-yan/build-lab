name: Dahua SDK diagnostics

on:
  push:
    branches:
      - test/dahua-sdk-examples
    paths:
      - 'Dhua/**'
      - '.github/workflows/dahua-sdk-diagnostics.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Dhua/**'
      - '.github/workflows/dahua-sdk-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-c-linux64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - name: Inspect exact C API signatures
        shell: bash
        run: |
          set -euxo pipefail
          SDK='Dhua/设备网络SDK_C_Linux64_IS_V3.061.0000000.0.R.260515/设备网络SDK_C_Linux64_IS_V3.061.0000000.0.R.260515'
          mkdir -p /tmp/dahua-c64
          tar -xf "$SDK" -C /tmp/dahua-c64
          HEADER=/tmp/dahua-c64/Include/Common/dhnetsdk.h
          echo '=== callback typedefs ==='
          grep -n -B3 -A8 -E 'fTimeDownLoadPosCallBack|fDataCallBack' "$HEADER" | head -160 || true
          echo '=== download status/stop APIs ==='
          grep -n -B2 -A3 -E 'CLIENT_(GetDownloadPos|StopDownload|DownloadByTimeEx)' "$HEADER" | head -160 || true
          echo '=== official playback demo callback/download code ==='
          sed -n '1,90p;585,635p' /tmp/dahua-c64/Demo/03.PlayBack/dialog.cpp

  inspect-c-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - name: Verify aarch64 C SDK API and libraries
        shell: bash
        run: |
          set -euxo pipefail
          SDK='Dhua/设备网络SDK_C_aarch64_IS_V3.061.0000000.0.R.260515/设备网络SDK_C_aarch64_IS_V3.061.0000000.0.R.260515'
          mkdir -p /tmp/dahua-carm
          tar -xf "$SDK" -C /tmp/dahua-carm
          file /tmp/dahua-carm/Bin/libdhnetsdk.so
          grep -n -E 'CLIENT_LoginWithHighLevelSecurity|CLIENT_Logout\(|CLIENT_DownloadByTimeEx\(' /tmp/dahua-carm/Include/Common/dhnetsdk.h | head -30

  inspect-jar-arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Inspect exact Java callback signatures
        shell: bash
        run: |
          set -euxo pipefail
          ROOT='Dhua/设备网络SDK_JAR_LinuxARM_IS_V3.061.0000000.0.R.260511/General_NetSDK_ChnEng_JAR_LinuxARM_IS_V3.061.0000000.0.R.260511'
          API="$ROOT/src/main/resources/netsdk-api-linuxARM-1.0.jar"
          DYN="$ROOT/src/main/resources/netsdk-dynamic-lib-linuxARM-1.0.jar"
          JNA="$ROOT/src/main/resources/jna.jar"
          SRC="$ROOT/source/netsdk-api-linuxARM-1.0-sources.jar"
          echo '=== NetSDKLib relevant source ==='
          unzip -p "$SRC" com/netsdk/lib/NetSDKLib.java > /tmp/NetSDKLib.java
          grep -n -B4 -A12 -E 'interface fTimeDownLoadPosCallBack|interface fDataCallBack|CLIENT_DownloadByTimeEx\(|CLIENT_StopDownload\(|CLIENT_GetDownloadPos\(' /tmp/NetSDKLib.java | head -260 || true
          echo '=== binary signatures ==='
          javap -classpath "$API:$JNA" com.netsdk.lib.NetSDKLib | grep -E 'CLIENT_(DownloadByTimeEx|StopDownload|GetDownloadPos|LoginWithHighLevelSecurity|Logout)' || true
          echo '=== native bundle ==='
          jar tf "$DYN" | grep -E 'linuxARM/.*\.so$'
